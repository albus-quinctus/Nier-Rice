# sway — escritorio de trabajo con el aspecto y los atajos del XFCE de lilith.
# Se enlaza desde ~/.config/sway/config con: sh /srv/nier/yorha/instalar-usuario.sh xfce
# Recargar: Super+Mayús+c. Comparte sway-comun.conf, sesion.sh, teclas.sh y comun.sh con YoRHa.

include /srv/nier/yorha/sway-comun.conf

set $xfce /srv/nier/yorha/xfce
set $terminal foot
set $orden sh /srv/nier/yorha/xfce/orden.sh

# Tema de lilith: Orchis-Grey-Compact, iconos Gruvbox-Plus-Dark y FOT-Rodin Pro
exec_always gsettings set org.gnome.desktop.interface gtk-theme 'Orchis-Grey-Compact'
exec_always gsettings set org.gnome.desktop.interface icon-theme 'Gruvbox-Plus-Dark'
exec_always gsettings set org.gnome.desktop.interface font-name 'FOT-Rodin Pro Semi-Bold 10'
font pango:FOT-Rodin Pro Semi-Bold 9
output * bg /usr/share/images/desktop-base/desktop-background-nier-ligth.svg fill #2b2b2b

# Panel (lleva también swayidle: bloqueo a los 5 min, pantalla apagada a los 10) y avisos.
# Si el panel se cae, vigilar.sh lo vuelve a arrancar mientras sway siga vivo: así nunca se
# queda sin bloqueo (sus errores, en $XDG_RUNTIME_DIR/yorha-vigilar.log)
exec sh $yorha/vigilar.sh python3 -I $xfce/panel.py
exec mako --config $xfce/mako.conf

# La red, con su icono en la bandeja (el llavero y demás van en sway-comun.conf)
exec nm-applet --indicator
# Lo que tengas en inicio automático (~/.config/autostart), como al entrar en XFCE
exec python3 -I $xfce/autoarranque.py

# Ventanas: todas flotan, al centro, con barra de título; foco al hacer clic, como xfwm4
for_window [all] floating enable
# Borde de 6 px (del color de la barra, apenas se nota): con 2 px casi no se podía coger para
# cambiar el tamaño arrastrando, como en xfwm4
default_border normal 6
default_floating_border normal 6
floating_maximum_size -1 x -1
focus_follows_mouse no
title_align center
titlebar_padding 10 4
gaps inner 0

# Colores claros, como el tema de ventanas de lilith
# Colores:              borde    fondo    texto    indicador borde_hijo
client.focused          #d8d4cc  #d8d4cc  #2b2b2b  #d8d4cc   #d8d4cc
client.focused_inactive #ebe8e3  #ebe8e3  #8a8780  #ebe8e3   #ebe8e3
client.unfocused        #ebe8e3  #ebe8e3  #8a8780  #ebe8e3   #ebe8e3
client.urgent           #cd664d  #cd664d  #ffffff  #cd664d   #cd664d
client.background       #2b2b2b

# El touchpad se queda como en XFCE (lo que trae libinput)

# Mover con Alt+arrastrar y cambiar el tamaño con Alt+botón derecho, como xfwm4
floating_modifier Mod1 normal

# Menú, terminal, archivos
bindsym --release Super_L exec $orden menu
bindsym $mod+Shift+Return exec $terminal
bindsym Ctrl+Mod1+t exec $terminal
bindsym Ctrl+Mod1+l exec sh $xfce/bloquear.sh
bindsym Ctrl+Mod1+Delete exec $orden salir

# Capturas: pantalla, zona y ventana
bindsym Print exec sh $xfce/captura.sh pantalla
bindsym Shift+Print exec sh $xfce/captura.sh zona
bindsym Mod1+Print exec sh $xfce/captura.sh ventana

# Ventanas, con los atajos de xfwm4
bindsym Mod1+F4 kill
bindsym Mod1+F9 exec $orden minimizar
bindsym Mod1+F10 exec $orden maximizar
bindsym Mod1+F11 fullscreen toggle
bindsym $mod+Up exec $orden maximizar
bindsym $mod+Down exec $orden minimizar
bindsym $mod+Left exec $orden izquierda
bindsym $mod+Right exec $orden derecha
# Alt+Tab abre el selector del panel; con Alt pulsado, Tab avanza y al soltar Alt se elige
bindsym Mod1+Tab exec $orden alttab
bindsym Mod1+Shift+Tab exec $orden alttab-atras

# Cuatro escritorios: Ctrl+F1…F4, Ctrl+Alt+flechas para pasar y llevarse la ventana
bindsym Ctrl+F1 workspace number 1
bindsym Ctrl+F2 workspace number 2
bindsym Ctrl+F3 workspace number 3
bindsym Ctrl+F4 workspace number 4
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym Ctrl+Mod1+Left workspace prev_on_output
bindsym Ctrl+Mod1+Right workspace next_on_output
bindsym Ctrl+Mod1+Shift+Left move container to workspace prev_on_output, workspace prev_on_output
bindsym Ctrl+Mod1+Shift+Right move container to workspace next_on_output, workspace next_on_output
