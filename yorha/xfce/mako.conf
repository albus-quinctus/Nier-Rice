# mako — notificaciones del escritorio de trabajo, oscuras como las de xfce4-notifyd
font=FOT-Rodin Pro 10
background-color=#2b2b2bf2
text-color=#eeeeee
border-color=#454545
border-size=1
border-radius=6
padding=10,12
margin=12
width=360
icons=1
max-icon-size=32
default-timeout=6000
anchor=top-right
progress-color=over #6b6b6b

[urgency=high]
border-color=#cd664d
default-timeout=0

# "No molestar" del panel: solo se ven las urgentes (batería baja)
[mode=no-molestar]
invisible=1

[mode=no-molestar urgency=high]
invisible=0
