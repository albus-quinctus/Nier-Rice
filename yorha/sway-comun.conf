# sway — lo que comparten YoRHa (sway.conf) y el escritorio de trabajo (xfce/sway.conf).
# Cada uno lo incluye al principio y solo escribe lo suyo.

include /etc/sway/config.d/*

# Sin Xwayland (no está instalado): ningún programa X11 puede espiar a los demás
xwayland disable
# El portal (compartir pantalla en videollamadas) necesita saber que esto es sway
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland

set $mod Mod4
set $yorha /srv/nier/yorha

# Lo que XFCE arrancaba solo: llavero, permisos de administrador y enlaces de snap (Obsidian).
# Entre comillas: sin ellas, sway toma la coma como separador de órdenes
exec "gnome-keyring-daemon --start --components=secrets,pkcs11"
exec /usr/libexec/polkit-mate-authentication-agent-1
exec snap userd --autostart

input type:keyboard xkb_layout es

# Archivos (ARCHBOX)
bindsym $mod+e exec python3 -I $yorha/archbox/archbox.py
# Pantallas externas y proyector (como Win+P); Mod+Shift+p las enciende todas por si
# alguna se queda a oscuras
bindsym $mod+p exec python3 -I $yorha/ajustes.py --seccion screens
bindsym $mod+Shift+p output * enable

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+c reload

# Volumen y brillo con las teclas del portátil; teclas.sh avisa a la barra o al panel
bindsym --locked XF86AudioRaiseVolume exec sh $yorha/teclas.sh subir
bindsym --locked XF86AudioLowerVolume exec sh $yorha/teclas.sh bajar
bindsym --locked XF86AudioMute exec sh $yorha/teclas.sh silencio
bindsym --locked XF86MonBrightnessUp exec sh $yorha/teclas.sh mas-brillo
bindsym --locked XF86MonBrightnessDown exec sh $yorha/teclas.sh menos-brillo
