# sway mínimo para la pantalla de inicio (greetd lo arranca como _greetd con config.toml).
# Solo muestra saludo.py: sin barra, sin atajos y sin Xwayland, así no se puede abrir nada más.
# Al terminar el saludo (sesión iniciada o fallo), sway sale y greetd sigue: lanza la
# sesión del usuario o vuelve a arrancar este sway.

xwayland disable
# Sin swaynag: si algo de aquí fallara no saldría ninguna barra con botones
swaynag_command -
font pango:FOT-Rodin Pro, DejaVu Sans 13

output * bg /srv/nier/yorha/fondos/yorha-claro.png fill #CDC8B0
default_border none
default_floating_border none

input type:keyboard xkb_layout es
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# Un solo atajo, y no abre nada: Ctrl+Alt+Retroceso cierra este sway y greetd vuelve a
# empezar la pantalla de inicio (por si se queda solo el fondo). Ni terminal, ni lanzador.
# Cambiar de consola (Ctrl+Alt+F1…F12) sigue funcionando: lo hace sway por su cuenta.
bindsym Ctrl+Mod1+BackSpace exit

# saludo.sh abre saludo.py (otra vez si se cae), apunta los fallos en ~_greetd/saludo.log
# y al terminar cierra este sway
exec sh /srv/nier/yorha/greeter/saludo.sh
