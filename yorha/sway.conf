# sway — entorno YoRHa (rehecho desde hyprland-yorha). Se enlaza desde ~/.config/sway/config.
# Recargar: Mod+Shift+c. Lo común con el escritorio de trabajo está en sway-comun.conf.

include /srv/nier/yorha/sway-comun.conf

font pango:FOT-Rodin Pro, DejaVu Sans 13

# Fondo (tema claro por defecto; Mod+t alterna claro/oscuro)
output * bg $yorha/fondos/yorha-claro.png fill #CDC8B0
# Al recargar (Mod+Shift+c) se vuelve a poner el tema elegido con Mod+t
exec_always sh $yorha/tema.sh aplicar

# Barra de escritorios propia; con exec arranca una sola vez, y vigilar.sh la vuelve a abrir
# si se cae (sin ella no hay aviso de batería baja ni hibernar al 5 %)
exec sh $yorha/vigilar.sh python3 -I $yorha/barra.py
exec mako --config $yorha/mako.conf

# La red se maneja desde el panel (Mod), sin nm-applet.
# Lo que tengas en inicio automático (~/.config/autostart), como al entrar en XFCE
exec python3 -I $yorha/xfce/autoarranque.py

# Ventanas: barra de título marrón de 40 px y sin bordes, como hyprbars
default_border normal 0
default_floating_border normal 0
title_align left
titlebar_padding 12 10
gaps inner 20
gaps outer 20
# Abajo se deja libre la franja NieR, como hacía el original reservando arriba y abajo
gaps bottom 95

# Colores:              borde    fondo    texto    indicador borde_hijo
client.focused          #48463d  #48463d  #c2bda6  #48463d   #48463d
client.focused_inactive #48463d  #48463d  #9e9a87  #48463d   #48463d
client.unfocused        #48463d  #48463d  #9e9a87  #48463d   #48463d
client.urgent           #cd664d  #cd664d  #f4f0e1  #cd664d   #cd664d
client.background       #c2bda6

# Trackpad
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# Bloqueo a los 5 min y pantalla apagada a los 10, como en el original; vigilar.sh vuelve a
# abrir swayidle si se cae, para que nunca se quede sin bloqueo
exec sh $yorha/vigilar.sh swayidle -w timeout 300 'sh $yorha/bloquear.sh' timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep 'sh $yorha/bloquear.sh'

# Atajos principales
bindsym $mod+Return exec sh $yorha/terminal.sh
# Panel de ajustes (abre o cierra): pulsando solo Mod; Mod+Escape lo abre en POWER
# y Mod+m en MUSIC. --release: solo salta al soltar Super sin pulsar otra tecla entre medias
bindsym --release Super_L exec python3 -I $yorha/ajustes.py
# Buscador de aplicaciones solo (abre o cierra), sin el panel de ajustes
bindsym $mod+Tab exec python3 -I $yorha/lanzador.py
bindsym $mod+Escape exec python3 -I $yorha/ajustes.py --seccion power

bindsym $mod+m exec python3 -I $yorha/ajustes.py --seccion music
# Harmony Music en el scratchpad: no ocupa escritorio. Mod+Shift+m la muestra u oculta
# (Mod+q la cierra del todo y para la música)
bindsym $mod+Shift+m exec sh $yorha/harmony.sh
for_window [app_id="harmonymusic"] floating enable, resize set 1100 720, move scratchpad, scratchpad show, move position center
bindsym $mod+q kill
bindsym $mod+l exec sh $yorha/bloquear.sh
bindsym $mod+t exec sh $yorha/tema.sh
bindsym Print exec grim -g "$(slurp)" - | wl-copy
floating_modifier $mod normal

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle

# Seis escritorios (UNO … SEIS); la séptima pestaña de la barra es SISTEMA
# Al cambiar, el escritorio actual se desliza fuera como en el original (escritorio.sh)
bindsym $mod+1 exec sh $yorha/escritorio.sh 1
bindsym $mod+2 exec sh $yorha/escritorio.sh 2
bindsym $mod+3 exec sh $yorha/escritorio.sh 3
bindsym $mod+4 exec sh $yorha/escritorio.sh 4
bindsym $mod+5 exec sh $yorha/escritorio.sh 5
bindsym $mod+6 exec sh $yorha/escritorio.sh 6
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6

bindsym $mod+Shift+e exec swaymsg exit
